site_name: loglibrary
site_description: A small wiki about logarithms.
site_url: https://mcembalest.github.io/loglibrary/

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Foundations:
      - The logarithm: foundations/logarithm.md
      - From products to sums: foundations/product-to-sum.md
      - The natural logarithm: foundations/natural-log.md
  - History:
      - Napier: history/napier.md
      - Briggs and base 10: history/briggs.md
  - Interpretations:
      - Length: interpretations/length.md
      - Information and entropy: interpretations/entropy.md
      - Complexity and addressing: interpretations/complexity.md
      - Dimension and capacity: interpretations/dimension.md
  - Logarithmic scales: scales.md
  - Continued logarithms:
      - Overview: clogs/index.md
      - Two lineages: clogs/lineages.md
      - Gallery: clogs/gallery.md
